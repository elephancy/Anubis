name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/anubis_ci
      SESSION_SECRET: ci-session-secret-not-used-in-production
      PWD_PEPPER: ci-password-pepper-not-used-in-production
      UPLOAD_DIR: /tmp/anubis-uploads
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Preserve unit coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-anubis-unit
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true

      - name: Build
        run: npm run build
